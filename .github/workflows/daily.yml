name: Nightly Pipeline

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          APP_ENV: production
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: alembic upgrade head

      - name: Run nightly pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          APP_ENV: production
          LOG_LEVEL: INFO
          RM_NAMES: ${{ secrets.RM_NAMES }}
          # Pipeline never signs cookies, but src.config enforces SECRET_KEY
          # when APP_ENV=production. Workflow uses a dedicated secret distinct
          # from the Railway webserver's SECRET_KEY.
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python -m src.pipeline

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Nightly pipeline failed: run ${{ github.run_id }}" \
            --body "The nightly pipeline workflow failed. Investigate before the next scheduled run.\n\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
