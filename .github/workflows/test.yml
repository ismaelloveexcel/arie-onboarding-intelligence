name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-shared-db
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Verify test DB secret is set
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          if [ -z "$DATABASE_URL_TEST" ]; then
            echo "::error::DATABASE_URL_TEST secret is not set. Refusing to run tests against an unknown database."
            exit 1
          fi

      - name: Verify test DB host is allowed for migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          ALLOWED_DB_HOSTS: ${{ secrets.ALLOWED_DB_HOSTS_TEST }}
        run: |
          python - <<'EOF'
          import os, sys
          from urllib.parse import urlparse
          host = urlparse(os.environ["DATABASE_URL"]).hostname or ""
          allowed = [h.strip() for h in os.environ.get("ALLOWED_DB_HOSTS", "").split(",") if h.strip()]
          if host not in allowed:
              print(f"::error::DB host '{host}' is not in ALLOWED_DB_HOSTS_TEST. Refusing to run Alembic.")
              sys.exit(1)
          print(f"DB host '{host}' is in ALLOWED_DB_HOSTS_TEST. Proceeding with migrations.")
          EOF

      - name: Apply migrations to test DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          APP_ENV: development
          LOG_LEVEL: DEBUG
          RM_NAMES: Test
          ALLOWED_DB_HOSTS: ${{ secrets.ALLOWED_DB_HOSTS_TEST }}
        run: python -m pytest -v
