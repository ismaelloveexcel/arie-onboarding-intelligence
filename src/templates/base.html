<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arie Leads{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <nav class="nav">
    <span class="brand">Arie Leads</span>
    <a href="/">Queue</a>
    <a href="/upload">Upload</a>
    <a href="/audit">Audit Log</a>
    <a href="/health" style="font-size:12px; opacity:.7">Health</a>
    {% if actor_names %}
    <form method="post" action="/me" style="display:inline; margin-left:auto">
      <select name="actor" onchange="this.form.submit()" style="font-size:12px">
        <option value="">Acting as…</option>
        {% for name in actor_names %}
          <option value="{{ name }}" {% if current_actor == name %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </form>
    {% else %}
    <span style="margin-left:auto"></span>
    {% endif %}
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
