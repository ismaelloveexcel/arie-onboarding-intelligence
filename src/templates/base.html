<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ARIE Prospect Action Desk{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="brand-lockup" aria-label="ARIE Prospect Action Desk">
        <img class="brand-logo" src="/static/arie-finance-logo-white.png" alt="">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-product">Prospect Action Desk</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/dashboard" {% if request.url.path == '/dashboard' %}class="is-active"{% endif %}>Dashboard</a>
        <a href="/" {% if request.url.path == '/' %}class="is-active"{% endif %}>Prospect Queue</a>
        <a href="/introducers" {% if request.url.path.startswith('/introducers') %}class="is-active"{% endif %}>Introducers</a>
        <a href="/upload" {% if request.url.path == '/upload' %}class="is-active"{% endif %}>Uploads</a>
        <a href="/audit" {% if request.url.path == '/audit' %}class="is-active"{% endif %}>Audit</a>
      </nav>
      <form method="post" action="/me" class="actor-select">
        <label for="actor-select">Acting as</label>
        <select id="actor-select" name="actor" onchange="this.form.requestSubmit()"
                aria-label="Acting as (sets the actor recorded in the audit log)">
          <option value="">— Select —</option>
          {% for name in actor_names|default([]) %}
          <option value="{{ name }}" {% if name == (current_actor|default('')) %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </form>
    </div>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <div id="toast" style="
    position:fixed; bottom:1.5rem; right:1.5rem;
    background:#111827; color:#fff;
    padding:.6rem 1.1rem; border-radius:6px;
    font-size:13px; font-weight:500;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    opacity:0; transition:opacity .2s ease;
    pointer-events:none; z-index:9999;
  " aria-live="polite"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
    }
    document.body.addEventListener('htmx:afterRequest', function(e) {
      const method = (e.detail.requestConfig?.verb || '').toUpperCase();
      const ok = e.detail.successful;
      if (method === 'POST' && ok) {
        showToast('Saved');
      }
    });
  </script>
</body>
</html>
